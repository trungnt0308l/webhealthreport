<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Logo badge -->
  <rect x="88" y="200" width="72" height="72" rx="16" fill="#2563eb"/>
  <text x="124" y="251" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="white" text-anchor="middle">W</text>

  <!-- Product name -->
  <text x="88" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#93c5fd" letter-spacing="0.5">WEBSITE HEALTH REPORT</text>

  <!-- Main headline -->
  <text x="88" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">Scan your site.</text>
  <text x="88" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">Fix what's broken.</text>

  <!-- Subtext -->
  <text x="88" y="506" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#bfdbfe">Free. No account required. Up to 1,000 pages.</text>

  <!-- Right side — feature pills -->
  <g transform="translate(820, 180)">
    <!-- Pill 1 -->
    <rect width="300" height="48" rx="24" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="28" cy="24" r="8" fill="#4ade80"/>
    <text x="48" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white">Broken links</text>

    <!-- Pill 2 -->
    <rect y="64" width="300" height="48" rx="24" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="28" cy="88" r="8" fill="#4ade80"/>
    <text x="48" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white">Broken images</text>

    <!-- Pill 3 -->
    <rect y="128" width="300" height="48" rx="24" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="28" cy="152" r="8" fill="#4ade80"/>
    <text x="48" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white">Redirect chains</text>

    <!-- Pill 4 -->
    <rect y="192" width="300" height="48" rx="24" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="28" cy="216" r="8" fill="#4ade80"/>
    <text x="48" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white">Missing titles</text>

    <!-- Pill 5 -->
    <rect y="256" width="300" height="48" rx="24" fill="#ffffff" fill-opacity="0.12"/>
    <circle cx="28" cy="280" r="8" fill="#4ade80"/>
    <text x="48" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="white">Health score A–F</text>
  </g>

  <!-- Bottom domain -->
  <text x="88" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#60a5fa" fill-opacity="0.8">webhealthreport.pages.dev</text>
</svg>
